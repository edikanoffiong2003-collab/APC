<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-translate="agent_page_title">Polling Unit Agent Registration - Senator Allwell Onyesoh</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #0f172a; margin: 0; padding: 0; }
    .form-card { max-width: 750px; margin: 40px auto; background: #ffffff; padding: 35px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15); }
    .form-card h2 { color: #0f172a; margin-bottom: 8px; border-bottom: 2px solid #28a745; padding-bottom: 10px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-weight: 700; margin-bottom: 6px; color: #334155; }
    .form-group input, .form-group select { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
    .btn-agent { width: 100%; padding: 14px; background: #28a745; color: white; font-weight: bold; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s ease; }
    .btn-agent:hover { background: #218838; }
  </style>
</head>
<body>

  <div class="form-card">
    <h2 data-translate="agent_heading"><i class="fa-solid fa-user-shield" style="color: #28a745;"></i> Polling Unit Agent & Volunteer Sign-Up</h2>
    <p style="margin-bottom: 20px; color: #64748b; font-size: 14px;" data-translate="agent_sub">Help protect votes and monitor collation across the 8 LGAs of Rivers East Senatorial District.</p>

    <form id="agentForm" onsubmit="handleAgentRegistration(event)">
      <div class="form-group">
        <label data-translate="label_fullname">Full Name (as on PVC):</label>
        <input type="text" id="agentName" placeholder="e.g. Tamuno Blessing" required>
      </div>

      <div class="form-group">
        <label data-translate="label_phone">Phone Number / WhatsApp:</label>
        <input type="tel" id="agentPhone" placeholder="08012345678" required>
      </div>

      <div class="form-group">
        <label data-translate="label_lga">Local Government Area (LGA):</label>
        <select id="agentLga" onchange="updateWards()" required>
          <option value="">Select LGA</option>
          <option value="etche">Etche</option>
          <option value="omuma">Omuma</option>
          <option value="obioakpor">Obio/Akpor</option>
          <option value="portharcourt">Port Harcourt City</option>
          <option value="ikwerre">Ikwerre</option>
          <option value="emohua">Emohua</option>
          <option value="okrika">Okrika</option>
          <option value="ogubolo">Ogu/Bolo</option>
        </select>
      </div>

      <div class="form-group">
        <label data-translate="label_ward">Ward Name / Number:</label>
        <select id="agentWard" required disabled>
          <option value="">-- Choose LGA First --</option>
        </select>
      </div>

      <div class="form-group">
        <label data-translate="label_pu_number">Polling Unit Name or Code (if known):</label>
        <input type="text" id="agentPu" placeholder="e.g. PU 008, Community Primary School">
      </div>

      <div class="form-group">
        <label data-translate="label_pvc_status">Do you have a valid PVC for this Polling Unit?</label>
        <select id="agentPvcStatus" required>
          <option value="Yes">Yes - Valid PVC Ready</option>
          <option value="Transferring">Currently Transferring Location</option>
          <option value="No">No - Need Voter Registration Assistance</option>
        </select>
      </div>

      <button type="submit" class="btn-agent" data-translate="btn_agent_submit">Register as Polling Agent</button>
    </form>
  </div>

 <script>
    const STORAGE_KEY = 'apc_rivers_east_user';
    const VOTER_DB_KEY = 'apc_pledged_voters_list';

    // Database of LGAs and their respective Wards (Rivers East 8 LGAs)
    const wardDatabase = {
      emohua: [
        "Ogbakiri I", "Ogbakiri II", "Emohua I", "Emohua II", "Obelle", 
        "Ibaa", "Rundele", "Rumuekpe", "Elele Alimini", "Omudioga / Akpadu", 
        "Egbeda", "Ubimini", "Odegu I", "Odegu II"
      ],
      etche: [
        "Afara", "Egbu", "Igbo I", "Igbo II", "Igbo III", 
        "Egwi / Opiro", "Nihi", "Odufor", "Obibi / Akwukabi", "Obite", 
        "Okehi", "Ozuzu", "Ulakwo", "Igbodo", "Akwa / Odogwa", 
        "Akpoku / Umuoye", "Ndashi", "Mba", "Owu"
      ],
      ikwerre: [
        "Isiokpo I", "Isiokpo II", "Elele I", "Elele II", "Omerelu", 
        "Apani", "Umuanwa", "Ubima", "Omagwa", "Omademe / Ipo", 
        "Ozuaha", "Igwuruta", "Aluu"
      ],
      obioakpor: [
        "Oro-Igwe", "Rumuodara", "Rumuokwu (2B)", "Rumuodomaya (3A)", "Elelenwo (3B)", 
        "Worji", "Rumuokoro", "Rumuomasi", "Rumueme (7A)", "Rumueme (7B)", 
        "Rumueme (7C)", "Rumuigbo (8A)", "Rumukwuta (8B)", "Rukpokwu", 
        "Choba", "Ozuoba / Ogbogoro", "Rumuolumeni"
      ],
      ogubolo: [
        "Ogu I", "Ogu II", "Ogu III", "Ogu IV", "Ogu V", 
        "Ogu VI", "Bolo I", "Bolo II", "Bolo III", "Bolo IV", 
        "Wakama", "Ele"
      ],
      okrika: [
        "Okrika I", "Okrika II", "Okrika III", "Okrika IV", "Okrika V", 
        "Okrika VI", "Okrika VII", "Ogan", "Kalio", "Ogoloma I", 
        "Ogoloma II", "Ogoloma III"
      ],
      omuma: [
        "Eberi-Dikeomuuo Community", "Ariraniiri / Owu-Ahia Community", "Obiohia Community", "Ohimogho Community", "Oyoro", 
        "Ofeh Community", "Umuogba I Community", "Umuogba II Community", "Obibi / Ajuloke Community", "Umuajuloke Community"
      ],
      portharcourt: [
        "Oromineke / Ezimgbu", "Orogbum", "Oroabali", "Ogbunabali", "Port Harcourt Township I", 
        "Port Harcourt Township II (or VI)", "Port Harcourt VII", "Ochiri / Rumukalagbor", "Oroworukwo", "Nkpolu Oroworukwo", 
        "Rumuwoji (One)", "Rumuwoji (Two)", "Rumuwoji (Three)", "Mgbundukwu (One)", "Mgbundukwu (Two)", 
        "Rumuobiekwe", "Diobu", "Nkpolu Oroworukwo Two", "Elekahia", "Abuloma / Amadi-Ama"
      ]
    };

    function updateWards() {
      const lgaSelect = document.getElementById('agentLga');
      const wardSelect = document.getElementById('agentWard');
      if (!lgaSelect || !wardSelect) return;

      const selectedLga = lgaSelect.value;
      wardSelect.innerHTML = '<option value="">-- Select Ward --</option>';

      if (selectedLga && wardDatabase[selectedLga]) {
        wardDatabase[selectedLga].forEach(ward => {
          const option = document.createElement("option");
          option.value = ward;
          option.textContent = ward;
          wardSelect.appendChild(option);
        });
        wardSelect.disabled = false;
      } else {
        wardSelect.disabled = true;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      // 1. Pre-fill form details if user registered via auth system
      const storedUser = localStorage.getItem(STORAGE_KEY);
      if (storedUser) {
        const user = JSON.parse(storedUser);
        if (user.name && document.getElementById('agentName')) document.getElementById('agentName').value = user.name;
        if (user.phone && document.getElementById('agentPhone')) document.getElementById('agentPhone').value = user.phone;
        
        if (user.lga && document.getElementById('agentLga')) {
          const lgaSelect = document.getElementById('agentLga');
          lgaSelect.value = user.lga;
          updateWards(); // Populate wards based on stored LGA
          
          if (user.ward && document.getElementById('agentWard')) {
            document.getElementById('agentWard').value = user.ward;
          }
        }
      }

      // 2. Check if user arrived via a shared WhatsApp referral link (?ref=...)
      const urlParams = new URLSearchParams(window.location.search);
      const refAgent = urlParams.get('ref');
      if (refAgent) {
        sessionStorage.setItem('referred_by_agent', refAgent);
      }
    });

    function handleAgentRegistration(event) {
      event.preventDefault();

      const name = document.getElementById('agentName').value;
      const phone = document.getElementById('agentPhone').value;
      const lga = document.getElementById('agentLga').value;
      const ward = document.getElementById('agentWard').value;
      const pu = document.getElementById('agentPu') ? document.getElementById('agentPu').value : '';
      const pvcStatus = document.getElementById('agentPvcStatus') ? document.getElementById('agentPvcStatus').value : 'Verified';

      // Retrieve existing account or generate new profile
      let existingUser = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};

      existingUser.name = name || existingUser.name;
      existingUser.phone = phone || existingUser.phone;
      existingUser.lga = lga || existingUser.lga;
      existingUser.ward = ward || existingUser.ward;
      existingUser.puCode = pu;
      existingUser.pvcStatus = pvcStatus;
      existingUser.isAgent = true;
      existingUser.tier = 'Verified PU Agent';
      
      if (!existingUser.campaignId) {
        existingUser.campaignId = 'APC-2027-' + Math.floor(1000 + Math.random() * 9000);
      }

      // Save updated profile state
      localStorage.setItem(STORAGE_KEY, JSON.stringify(existingUser));

      // 3. Handle referral signups if user registered via an agent's WhatsApp link
      const refAgent = sessionStorage.getItem('referred_by_agent');
      if (refAgent) {
        const newVoter = {
          id: Date.now(),
          name: name,
          phone: phone,
          lga: lga,
          dateLogged: new Date().toLocaleDateString()
        };

        // Save to agent-specific recruit tracking & global roster to update live targets
        const agentRecruitsKey = 'recruits_' + refAgent;
        let agentRecruits = JSON.parse(localStorage.getItem(agentRecruitsKey)) || [];
        agentRecruits.push(newVoter);
        localStorage.setItem(agentRecruitsKey, JSON.stringify(agentRecruits));

        let globalVoters = JSON.parse(localStorage.getItem(VOTER_DB_KEY)) || [];
        globalVoters.push(newVoter);
        localStorage.setItem(VOTER_DB_KEY, JSON.stringify(globalVoters));

        sessionStorage.removeItem('referred_by_agent');
        alert(`Registration successful! You have been successfully added to Senator Allwell Onyesoh's campaign roster.`);
        window.location.href = 'index.html';
        return;
      }

      alert('Polling Unit Agent application complete! Redirecting to your Grassroots Mobilization Hub...');

      // Redirect to mobilize.html
      window.location.href = 'mobilize.html';
    }
  </script>

  <!-- Google Translate Hidden Container & Scripts -->
  <div id="google_translate_element" style="display:none;"></div>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <script src="translations.js"></script>
  <script src="style.js"></script>
</body>
</html>
