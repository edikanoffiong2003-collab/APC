<style>
  /* ==========================================
     AGENT DASHBOARD STYLES (CLEAN & EMBEDDED)
     ========================================== */
  .voter-dashboard-container {
    margin-top: 35px;
    background: #ffffff;
    padding: 28px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    border: 1px solid #e2e8f0;
  }

  .dashboard-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .dashboard-title {
    color: #0f172a;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.3px;
  }

  .dashboard-subtitle {
    color: #64748b;
    font-size: 13px;
    margin-top: 4px;
  }

  .target-badge {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    padding: 8px 18px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 800;
    color: #16a34a;
  }

  .target-badge-num {
    color: #15803d;
    font-size: 15px;
  }

  .progress-bar-track {
    width: 100%;
    height: 12px;
    background: #e2e8f0;
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 25px;
  }

  .progress-bar-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #28a745, #15803d);
    transition: width 0.5s ease-in-out;
  }

  .table-responsive {
    width: 100%;
    overflow-x: auto;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
  }

  .voters-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-size: 14px;
  }

  .voters-table thead tr {
    background: #f8fafc;
    border-bottom: 2px solid #cbd5e1;
    color: #0f172a;
  }

  .voters-table th {
    padding: 14px;
    font-weight: 800;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #475569;
  }

  .voters-table td {
    padding: 14px;
    border-bottom: 1px solid #e2e8f0;
    vertical-align: middle;
  }

  .voters-table tbody tr:hover {
    background-color: #f8fafc;
  }

  .cell-index {
    font-weight: 800;
    color: #94a3b8;
  }

  .cell-name {
    font-weight: 700;
    color: #0f172a;
  }

  .cell-phone {
    color: #334155;
    font-weight: 600;
  }

  .cell-lga {
    color: #0f172a;
    font-weight: 700;
  }

  .badge-pvc {
    background: #dcfce7;
    color: #15803d;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 800;
    display: inline-block;
  }

  .btn-whatsapp {
    background: #25D366;
    color: #ffffff;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s ease;
  }

  .btn-whatsapp:hover {
    background: #1eb853;
  }

  .btn-delete {
    background: transparent;
    color: #ef4444;
    border: none;
    margin-left: 10px;
    padding: 6px;
    border-radius: 4px;
    cursor: pointer;
    transition: color 0.2s ease;
  }

  .btn-delete:hover {
    color: #b91c1c;
    background: #fee2e2;
  }

  .empty-roster-msg {
    text-align: center;
    padding: 35px 20px;
    color: #64748b;
    font-size: 14px;
  }

  .empty-icon {
    font-size: 36px;
    color: #cbd5e1;
    margin-bottom: 12px;
    display: block;
  }
</style>

<!-- ==========================================
     AGENT DASHBOARD HTML COMPONENT
     ========================================== -->
<div class="voter-dashboard-container">
  
  <!-- DASHBOARD PROGRESS HEADER -->
  <div class="dashboard-header">
    <div>
      <h3 class="dashboard-title">My Registered 20-Voter Roster</h3>
      <p class="dashboard-subtitle">Manage, track, and contact supporters pledged under your Campaign ID.</p>
    </div>
    <div class="target-badge">
      Target: <span id="voterCountNum" class="target-badge-num">0</span> / 20 Logged
    </div>
  </div>

  <!-- PROGRESS METER TRACK -->
  <div class="progress-bar-track">
    <div id="voterProgressBar" class="progress-bar-fill"></div>
  </div>

  <!-- VOTERS ROSTER TABLE -->
  <div class="table-responsive">
    <table class="voters-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Supporter Name</th>
          <th>Phone / WhatsApp</th>
          <th>LGA</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="voterTableBody">
        <!-- Rows dynamically added by JavaScript -->
      </tbody>
    </table>
  </div>

  <!-- EMPTY ROSTER STATE -->
  <div id="emptyRosterMsg" class="empty-roster-msg">
    <i class="fa-solid fa-users-slash empty-icon"></i>
    <p>No voters pledged yet. Use the form above to log your first supporter for Senator Allwell Onyesoh!</p>
  </div>

</div>
