<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join The Campaign Team | Rivers East 2027</title>
  
  <!-- Link your existing CSS stylesheet -->
  <link rel="stylesheet" href="styles.css" />
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body style="background-color: #f8f9fa;">

  <!-- Simple Header with Return Button -->
  <header style="padding: 1.5rem 0; background: #002b5b; color: #ffffff;">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto; padding: 0 1rem;">
      <h2 style="margin: 0; font-size: 1.25rem;">Rivers East Campaign Movement</h2>
      <a href="campaign-landing.html" style="color: #ffffff; text-decoration: none; font-weight: 600; font-size: 0.9rem;">
        <i class="fa-solid fa-arrow-left"></i> Back to Main Landing Page
      </a>
    </div>
  </header>

  <!-- Grassroots Mobilization Form Section -->
  <section id="volunteer" class="section bg-light" style="padding: 4rem 0;">
    <div class="container form-container" style="max-width: 600px; margin: 0 auto; background: #ffffff; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08);">
      
      <!-- User Logged-In Status View (Displays after successful registration) -->
      <div id="loggedInState" style="display: none; text-align: center; padding: 1.5rem; background: #e8f5e9; border: 1px solid #c8e6c9; border-radius: 8px; margin-bottom: 1.5rem;">
        <i class="fa-solid fa-circle-check" style="font-size: 3rem; color: #2e7d32; margin-bottom: 0.8rem;"></i>
        <h3 style="color: #1b5e20; margin-bottom: 0.3rem;">Welcome, <span id="userName">Volunteer</span>!</h3>
        <p style="color: #2e7d32; font-size: 0.95rem; margin-bottom: 1rem;">
          Status: <strong>Active Registered Volunteer (<span id="userLGA">LGA</span>)</strong>
        </p>
        <button id="logoutBtn" style="background: #dc3545; color: #fff; border: none; padding: 8px 18px; border-radius: 6px; font-weight: 600; cursor: pointer;">
          Log Out / Register Another Person
        </button>
      </div>

      <!-- Registration Form Container -->
      <div id="formContainer">
        <h2 class="section-title text-center" style="color: #002b5b; font-size: 2rem; margin-bottom: 0.5rem; text-align: center;">Join The Campaign Team</h2>
        <p class="section-subtitle text-center" style="color: #6c757d; margin-bottom: 2rem; text-align: center;">Register to support ward coordination, canvassing, or grassroots mobilization.</p>

        <form id="campaignForm" class="campaign-form">
          <div class="form-group" style="margin-bottom: 1.2rem;">
            <input type="text" id="fullName" placeholder="Full Name" required style="width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 1rem; box-sizing: border-box;" />
          </div>

          <div class="form-group" style="margin-bottom: 1.2rem;">
            <input type="tel" id="whatsapp" placeholder="WhatsApp Phone Number" required style="width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 1rem; box-sizing: border-box;" />
          </div>

          <div class="form-group" style="margin-bottom: 1.2rem;">
            <select id="lga" required style="width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 1rem; background: #fff; box-sizing: border-box;">
              <option value="" disabled selected>Select Your Local Government Area (LGA)</option>
              <option value="Port Harcourt">Port Harcourt City</option>
              <option value="Obio-Akpor">Obio-Akpor</option>
              <option value="Ikwerre">Ikwerre</option>
              <option value="Etche">Etche</option>
              <option value="Omuma">Omuma</option>
              <option value="Emohua">Emohua</option>
              <option value="Ogu/Bolo">Ogu/Bolo</option>
              <option value="Okrika">Okrika</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 1.5rem;">
            <input type="text" id="ward" placeholder="Ward / Polling Unit" required style="width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 1rem; box-sizing: border-box;" />
          </div>

          <button type="submit" id="submitBtn" class="btn-primary btn-block" style="width: 100%; background: #198754; color: #ffffff; padding: 14px; border: none; border-radius: 6px; font-size: 1.05rem; font-weight: 700; cursor: pointer;">
            Submit Registration
          </button>
        </form>

        <!-- Status Message Feedback -->
        <p id="formStatus" style="margin-top: 15px; text-align: center; font-weight: 600;"></p>
      </div>

    </div>
  </section>

  <!-- Dedicated JavaScript File -->
  <script src="register.js"></script>
</body>
</html>
