<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senator Allwell Onyesoh — Campaign Intro</title>
  
  <!-- Load Google's 3D Model Viewer Library -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b131e;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* 3D Canvas Container */
    model-viewer {
      width: 100vw;
      height: 60vh;
      outline: none;
    }

    /* Progress & Loader UI Container */
    .loader-container {
      width: 90%;
      max-width: 380px;
      text-align: center;
      margin-top: 10px;
    }

    /* Outer Loading Bar */
    .loader-bar-bg {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    /* Inner Animated Progress Fill (APC Colors Gradient) */
    #loader-progress {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00a8ff, #28a745, #dc3545);
      border-radius: 12px;
      transition: width 0.1s linear;
    }

    /* Info Label Row (Percent & Timer) */
    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    #progress-percent {
      color: #00a8ff; /* APC Sky Blue */
    }

    #progress-timer {
      color: #28a745; /* APC Green Accent */
      font-weight: 500;
    }

    /* Loading Subtext */
    .loader-status {
      margin-top: 12px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- 3D Interactive Model Container -->
  <model-viewer 
    src="src/octopus @sentorallwellonyesoh by vextrude.glb" 
    auto-rotate 
    rotation-per-second="45deg" 
    disable-zoom 
    camera-controls 
    shadow-intensity="1">
  </model-viewer>

  <!-- 25-Second Visual Progress Overlay -->
  <div class="loader-container">
    <div class="loader-bar-bg">
      <div id="loader-progress"></div>
    </div>

    <div class="progress-info">
      <span id="progress-percent">0%</span>
      <span id="progress-timer">25s remaining</span>
    </div>

    <p class="loader-status">Loading Campaign Hub...</p>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const progressBar = document.getElementById("loader-progress");
      const percentText = document.getElementById("progress-percent");
      const timerText = document.getElementById("progress-timer");

      const totalDuration = 25000; // 25 seconds in milliseconds
      const intervalTime = 100;    // Updates UI every 100 milliseconds
      let elapsedTime = 0;

      const progressInterval = setInterval(() => {
        elapsedTime += intervalTime;

        // Calculate progress percentage (0% to 100%)
        const percentage = Math.min(Math.floor((elapsedTime / totalDuration) * 100), 100);
        
        // Calculate countdown seconds (25s down to 0s)
        const secondsRemaining = Math.max(Math.ceil((totalDuration - elapsedTime) / 1000), 0);

        // Update HTML displays
        progressBar.style.width = percentage + "%";
        percentText.innerText = percentage + "%";
        timerText.innerText = secondsRemaining + "s remaining";

        // After 25 seconds, redirect to main campaign hub page
        if (elapsedTime >= totalDuration) {
          clearInterval(progressInterval);
          window.location.href = "main.html";
        }
      }, intervalTime);
    });
  </script>

</body>
</html>
